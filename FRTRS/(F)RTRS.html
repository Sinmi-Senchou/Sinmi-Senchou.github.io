        <!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        :root {
            --bg: #0f1a1a;
            --panel-bg: #132626;
            --accent: #2aa198;
            --accent-glow: #4db8a8;
            --accent-dim: #1f5c5c;
            --text: #d0e0df;
            --text-secondary: #8ba8a6;

            --danger: #c0392b;
            --success: #27ae60;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', monospace;
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 30%, rgba(34,85,85,0.15) 0%, transparent 70%), radial-gradient(ellipse at 20% 70%, rgba(42,161,152,0.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 60%, rgba(34,85,85,0.08) 0%, transparent 60%);
            font-family: var(--font-sans);
            color: var(--text);

        }
        .radio-device {
            background: var(--panel-bg);
            border-radius: 28px;
            padding: 30px 28px 24px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.03), 0 0 0 1px rgba(34,85,85,0.15);
            position: relative;

        }
        .radio-device::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(42,161,152,0.3), transparent);

        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 4px; }
        .live-clock { font-family: var(--font-mono); font-size: 1.05rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: livePulse 2s ease-in-out infinite; box-shadow: 0 0 8px rgba(39,174,96,0.6); }
        @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
        .status-badge { font-size: 0.78rem; padding: 5px 12px; border-radius: 20px; background: rgba(39,174,96,0.12); color: #5dde8e; letter-spacing: 0.4px; font-weight: 500; border: 1px solid rgba(39,174,96,0.2); white-space: nowrap; }
        .status-badge.offline { background: rgba(192,57,43,0.12); color: #e74c3c; border-color: rgba(192,57,43,0.2); }
        .status-badge.waiting { background: rgba(42,161,152,0.12); color: #2aa198; border-color: rgba(42,161,152,0.25); }
        .frequency-display { text-align: center; margin-bottom: 10px; }
        .freq-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-bottom: 2px; }
        .freq-number { font-family: var(--font-mono); font-size: 3.2rem; font-weight: 700; letter-spacing: 2px; background: linear-gradient(180deg, #8fd0c0 0%, #2aa198 40%, #185555 80%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 12px rgba(42,161,152,0.4)); line-height: 1.1; }
        .freq-unit { font-size: 0.9rem; letter-spacing: 1px; color: var(--text-secondary); -webkit-text-fill-color: var(--text-secondary); }
        .now-playing-section { background: rgba(0,0,0,0.25); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; border: 1px solid var(--border); text-align: center; min-height: 90px; display: flex; flex-direction: column; justify-content: center; }
        .song-title { font-size: 1.3rem; font-weight: 600; color: #e0f0ef; line-height: 1.3; word-break: break-word; }
        .song-artist { font-size: 0.9rem; color: var(--text-secondary); margin-top: 4px; }

        .no-song { color: var(--text-secondary); font-style: italic; opacity: 0.7; }
        .progress-container { margin-bottom: 10px; padding: 0 4px; }
        .progress-time-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 5px; }
        .progress-bar-outer { height: 6px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
        .progress-bar-inner { height: 100%; background: linear-gradient(90deg, #1f5c5c, #2aa198, #4db8a8); border-radius: 3px; transition: width 0.9s linear; position: relative; }
        .progress-bar-inner::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; border-radius: 50%; background: #5ec4b4; box-shadow: 0 0 10px rgba(42,161,152,0.7); opacity: 0.9; }
        .up-next { background: rgba(0,0,0,0.15); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        .up-next-icon { font-size: 1rem; }
        .up-next-info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .up-next-time { font-family: var(--font-mono); font-size: 0.73rem; color: var(--accent); white-space: nowrap; }
        .controls-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn-power { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #fff; font-size: 1.5rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-power:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(42,161,152,0.35); transform: scale(1.04); }
        .btn-power.on { border-color: var(--accent); box-shadow: 0 0 18px rgba(42,161,152,0.5); background: rgba(42,161,152,0.12); }
        .volume-slider-container { display: flex; align-items: center; gap: 8px; }
        .volume-icon { font-size: 1.2rem; color: var(--text-secondary); }
        .volume-slider { -webkit-appearance: none; width: 80px; height: 5px; border-radius: 3px; background: var(--progress-bg); outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #2aa198; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 8px rgba(42,161,152,0.6); }
        .volume-value { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary); width: 28px; text-align: center; }
        .schedule-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.78rem; color: var(--text-secondary); cursor: pointer; padding: 8px; opacity: 0.7; transition: opacity 0.2s; }
        .schedule-toggle:hover { opacity: 1; color: var(--accent); }
        .schedule-arrow { transition: transform 0.3s; display: inline-block; font-size: 0.65rem; }
        .schedule-arrow.open { transform: rotate(180deg); }
        .schedule-table-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.5s, margin 0.3s; }
        .schedule-table-wrapper.open { max-height: 400px; margin-top: 10px; }
        .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.73rem; background: rgba(0,0,0,0.2); border-radius: 10px; display: block; max-height: 280px; overflow-y: auto; }
        .schedule-table thead { position: sticky; top: 0; z-index: 1; }
        .schedule-table th { background: rgba(0,0,0,0.6); color: var(--accent); font-weight: 500; padding: 8px 10px; text-align: left; font-size: 0.68rem; text-transform: uppercase; }
        .schedule-table td { padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; }
        .schedule-table tr.now-playing-row { background: rgba(42,161,152,0.12); font-weight: 600; color: #c0f0e8; }
        .message-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1c2e2e; color: #2aa198; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 100; border: 1px solid rgba(42,161,152,0.3); box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: slideDown 0.4s; max-width: 90vw; text-align: center; }
        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .message-toast.error { background: #2b1e1e; color: #e74c3c; border-color: rgba(231,76,60,0.4); }
        @media (max-width: 480px) {
            .radio-device { padding: 20px 14px 16px; }
            .freq-number { font-size: 2.4rem; }
            .btn-power { width: 46px; height: 46px; }
            .volume-slider { width: 55px; }
        }
    </style>
</head>
<body>
<div class="radio-device">
    <div class="top-bar">
        <div class="live-clock"><span class="live-dot" id="liveDot"></span><span id="clockTime">--:--:--</span></div>
        <div class="status-badge offline" id="statusBadge">🔴 已关机</div>
    </div>
    <div class="frequency-display">
        <div class="freq-label">F R E Q U E N C Y</div>
        <div class="freq-number">98<span style="font-size:0.7em;">.</span>7 <span class="freq-unit">MHz</span></div>
    </div>
    <div class="now-playing-section">
        <div class="song-index" id="songIndex">—</div>
        <div class="song-title no-song" id="songTitle">按下电源键开启收音机</div>
        <div class="song-artist" id="songArtist"></div>
    </div>
    <div class="progress-container">
        <div class="progress-time-row"><span id="progressCurrent">00:00</span><span id="progressTotal">00:00</span></div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width: 0%;"></div></div>
    </div>
    <div class="up-next">
        <span class="up-next-icon">⏭</span><span class="up-next-info" id="upNextInfo">—</span><span class="up-next-time" id="upNextTime"></span>
    </div>
    <div class="controls-row">
        <button class="btn-power" id="btnPower">📻</button>
        <div class="volume-slider-container">
            <span class="volume-icon">🔈</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="75">
            <span class="volume-value" id="volumeValue">75%</span>
        </div>
    </div>
    <div class="schedule-toggle" id="scheduleToggle">📋 播放时间表 <span class="schedule-arrow">▼</span></div>
    <div class="schedule-table-wrapper" id="scheduleWrapper">
        <table class="schedule-table">
            <thead><tr><th class="time-col">开始时间</th><th class="dur-col">时长</th><th class="title-col">歌曲</th><th class="artist-col">艺术家</th></tr></thead>
            <tbody id="scheduleTbody"><tr><td colspan="4">加载中...</td></tr></tbody>
        </table>
    </div>
</div>
<audio id="audioPlayer" preload="auto" style="display:none;"></audio>
<div id="toastContainer"></div>

<script>
    
    (function() {
        console.log('🚀 电台启动');
        const MUSIC_PATH_PREFIX = 'music/';
        const RADIO_START = new Date(2026, 6, 29, 0, 0, 0); // 2026-07-29 00:00:00
        const manualPlaylist = [
            ['DDBY - 流星阶段.mp3', '03:33', '流星阶段', 'DDBY'],
            ['ginkiha - 聖輦船の風景.mp3', '03:53', '聖輦船の風景', 'ginkiha'],
        ];
        const LOOP = true;
        const SYNC_INTERVAL = 15000;

        const audio = document.getElementById('audioPlayer');
        const btnPower = document.getElementById('btnPower');
        const volSlider = document.getElementById('volumeSlider');
        const volVal = document.getElementById('volumeValue');
        const liveDot = document.getElementById('liveDot');
        const clockEl = document.getElementById('clockTime');
        const statusBadge = document.getElementById('statusBadge');
        const songIdx = document.getElementById('songIndex');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const progBar = document.getElementById('progressBar');
        const progCur = document.getElementById('progressCurrent');
        const progTotal = document.getElementById('progressTotal');
        const upNextInfo = document.getElementById('upNextInfo');
        const upNextTime = document.getElementById('upNextTime');
        const schedWrapper = document.getElementById('scheduleWrapper');
        const schedArrow = document.querySelector('.schedule-arrow');
        const schedTbody = document.getElementById('scheduleTbody');
        const toastContainer = document.getElementById('toastContainer');

        let playlist = [], totalDuration = 0;
        let power = false;
        let curIdx = -1, curStart = null, curEnd = null;
        let switchTimer = null, syncTimer = null, progFrame = null;
        let preloadAudio = null, toastTimer = null;
        let pendingRequest = null;

        // 工具函数
        const parseDur = s => { const m = s.match(/^(\d+):(\d+)$/); return m ? (+m[1]*60 + +m[2]) : parseFloat(s)||0; };
        const fmtSec = t => { const s = Math.floor(t); const m = Math.floor(s/60); const sec = s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; };
        const fmtTime = d => d ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}` : '--:--:--';
        const toast = (msg, err) => {
            if (toastTimer) clearTimeout(toastTimer);
            const old = toastContainer.querySelector('.message-toast'); if (old) old.remove();
            const el = document.createElement('div'); el.className = 'message-toast' + (err ? ' error' : ''); el.textContent = msg;
            toastContainer.appendChild(el);
            toastTimer = setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3000);
        };

        // 构建播放列表
        playlist = manualPlaylist.map(r => ({
            file: r[0], dur: parseDur(r[1]), title: r[2]||r[0], artist: r[3]||'',
            start: null, end: null
        })).filter(t => t.file && t.dur>0);

        if (!playlist.length) { schedTbody.innerHTML = '<tr><td colspan="4">列表为空</td></tr>'; return; }

        // 计算时间表
        let t = RADIO_START.getTime();
        playlist.forEach(track => { track.start = t; track.end = t + track.dur*1000; t = track.end; totalDuration += track.dur; });
        console.log('📅 总时长:', fmtSec(totalDuration));

        // 定位函数
        function locate(ts) {
            const start = RADIO_START.getTime();
            if (ts < start) return { idx:0, sec:0, before:true };
            let elapsed = ts - start;
            if (!LOOP && elapsed >= totalDuration*1000) return { idx:-1, sec:0, past:true };
            const cycle = Math.floor(elapsed / (totalDuration*1000));
            elapsed %= totalDuration*1000;
            for (let i=0; i<playlist.length; i++) {
                const relS = playlist[i].start - start;
                const relE = playlist[i].end - start;
                if (elapsed >= relS && elapsed < relE) {
                    return { idx:i, sec: (elapsed-relS)/1000, cycle };
                }
            }
            return { idx:0, sec:0 }; // fallback
        }

        function setTrack(idx, sec) {
            if (idx < 0 || idx >= playlist.length) return false;
            const track = playlist[idx];
            const src = MUSIC_PATH_PREFIX + track.file;
            console.log(`🎯 setTrack #${idx} "${track.title}" at ${fmtSec(sec)}`);

            // 清理旧计时器和监听
            if (switchTimer) clearTimeout(switchTimer);
            audio.pause();
            audio.removeEventListener('loadedmetadata', onMeta);
            audio.removeEventListener('error', onErr);
            pendingRequest = { idx, sec };

            // 强制重新加载
            audio.src = '';
            audio.addEventListener('loadedmetadata', onMeta, { once: true });
            audio.addEventListener('error', onErr, { once: true });
            audio.src = new URL(src, location.href).href;
            audio.volume = volSlider.value / 100;
        }

        function onMeta() {
            if (!pendingRequest) return;
            const { idx, sec } = pendingRequest;
            pendingRequest = null;
            const track = playlist[idx];
            const clamped = Math.min(Math.max(0, sec), track.dur);
            console.log(`🎵 loadedmetadata: currentTime = ${clamped}`);
            audio.currentTime = clamped;
            curIdx = idx; curStart = track.start; curEnd = track.end;
            updateNowPlaying();
            updateUpNext();
            highlightTable();
            const prom = audio.play();
            if (prom) prom.catch(e => { console.warn('play() rejected:', e.message); });
            scheduleSwitch();
        }

        function onErr() {
            if (!pendingRequest) return;
            const track = playlist[pendingRequest.idx];
            pendingRequest = null;
            console.error('🔥 加载失败:', track.file);
            toast(`⚠️ 无法加载 ${track.title}`, true);
            audio.removeEventListener('loadedmetadata', onMeta);
            if (power) setTimeout(() => { if(power) switchNext(); }, 2000);
        }

        function scheduleSwitch() {
            if (switchTimer) clearTimeout(switchTimer);
            if (curIdx < 0 || !curEnd) return;
            const remain = curEnd - Date.now();
            console.log('⏲️ 距离下一首:', fmtSec(remain/1000));
            if (remain <= 0) { switchNext(); return; }
            switchTimer = setTimeout(switchNext, remain + 100);
        }

        function switchNext() {
            if (!power) return;
            const nextIdx = (curIdx + 1) % playlist.length;
            if (!LOOP && nextIdx === 0) {
                stop(); statusBadge.textContent = '⏹ 结束'; return;
            }
            const now = Date.now();
            const next = playlist[nextIdx];
            let offset = 0;
            if (now > next.start) offset = Math.min((now - next.start)/1000, next.dur);
            setTrack(nextIdx, offset);
        }

        function stop() {
            audio.pause(); audio.src = '';
            if (switchTimer) clearTimeout(switchTimer);
            if (syncTimer) clearInterval(syncTimer);
            if (progFrame) cancelAnimationFrame(progFrame);
            curIdx = -1; curStart = curEnd = null;
            pendingRequest = null;
        }

        function powerOn() {
            power = true; btnPower.classList.add('on'); statusBadge.textContent = '🟢 直播中';
            liveDot.style.animation = 'livePulse 2s infinite';
            const pos = locate(Date.now());
            console.log('📍 当前位置:', pos);
            if (pos.past) { stop(); statusBadge.textContent = '⏹ 结束'; return; }
            if (pos.before) { toast('电台尚未开播'); return; }
            setTrack(pos.idx, pos.sec);
            syncTimer = setInterval(syncPos, SYNC_INTERVAL);
            startProgress();
        }

        function powerOff() {
            power = false; btnPower.classList.remove('on'); statusBadge.textContent = '🔴 已关机';
            liveDot.style.animation = ''; stop();
            songTitle.textContent = '按下电源键开启收音机'; songTitle.className = 'no-song';
        }

        function syncPos() {
            if (!power || curIdx < 0) return;
            const pos = locate(Date.now());
            if (pos.idx !== curIdx) setTrack(pos.idx, pos.sec);
            else if (Math.abs(pos.sec - audio.currentTime) > 2) {
                console.log('🔄 同步修正:', fmtSec(pos.sec));
                audio.currentTime = pos.sec;
            }
        }

        function startProgress() {
            function upd() {
                if (!power || curIdx < 0) { progFrame = requestAnimationFrame(upd); return; }
                const track = playlist[curIdx];
                const elapsed = (Date.now() - curStart) / 1000;
                const clamped = Math.min(Math.max(0, elapsed), track.dur);
                progBar.style.width = (clamped/track.dur*100) + '%';
                progCur.textContent = fmtSec(clamped);
                progTotal.textContent = fmtSec(track.dur);
                progFrame = requestAnimationFrame(upd);
            }
            progFrame = requestAnimationFrame(upd);
        }

        function updateNowPlaying() {
            if (curIdx < 0) return;
            const t = playlist[curIdx];
            songTitle.textContent = t.title; songTitle.className = 'song-title';
            songArtist.textContent = t.artist;
            songIdx.textContent = `TRACK ${curIdx+1}/${playlist.length}`;
        }

        function updateUpNext() {
            const next = (curIdx+1) % playlist.length;
            if (!LOOP && next===0) { upNextInfo.textContent = '—'; return; }
            const n = playlist[next];
            upNextInfo.textContent = `${n.title} — ${n.artist}`;
            let start = n.start;
            if (LOOP && start < Date.now()) {
                const cycles = Math.floor((Date.now()-start)/(totalDuration*1000)) + 1;
                start += cycles * totalDuration*1000;
            }
            upNextTime.textContent = fmtTime(new Date(start));
        }

        function highlightTable() {
            [...schedTbody.rows].forEach((r,i) => r.classList.toggle('now-playing-row', i===curIdx && power));
        }

        // 渲染时间表
        schedTbody.innerHTML = playlist.map((t,i) => `<tr data-idx="${i}"><td>${fmtTime(new Date(t.start))}</td><td>${fmtSec(t.dur)}</td><td>${t.title}</td><td>${t.artist}</td></tr>`).join('');

        // 事件绑定
        btnPower.onclick = () => power ? powerOff() : powerOn();
        volSlider.oninput = () => { volVal.textContent = volSlider.value+'%'; audio.volume = volSlider.value/100; };
        document.getElementById('scheduleToggle').onclick = () => {
            const open = schedWrapper.classList.toggle('open');
            schedArrow.classList.toggle('open', open);
        };

        audio.onerror = () => { if (!pendingRequest) { console.error('播放错误'); toast('⚠️ 播放出错', true); } };

        // 时钟
        setInterval(() => { const d = new Date(); clockEl.textContent = fmtTime(d); }, 1000);

        console.log('✅ 电台就绪，等待开机');
    })();
    
</script>
</body>
