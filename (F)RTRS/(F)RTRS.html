        <!DOCTYPE html>
<html lang="zh-CN">

    <style>

        📋 播放时间表 <span class="schedule-arrow" id="scheduleArrow">▼</span>

<audio id="audioPlayer" preload="auto" style="display:none;"></audio>
<div id="toastContainer"></div>

<script>
    
    (function() {
        // ==================== 配置区 ====================
        const MUSIC_PATH_PREFIX = 'music/';

        // ★★★ 电台第一首歌的开始时间（本地时间） ★★★
        const RADIO_START = new Date(2026, 6, 29, 0, 0, 0); // 2026年7月29日 00:00:00

        // ★★★ 手动播放列表（代替CSV） ★★★
        // 格式：每一条都是数组 [文件名, 时长, 歌曲名, 艺术家]
        // 时长支持 "MM:SS" 或纯秒数
        // 文件名必须与 music/ 文件夹内的文件完全一致（包括扩展名）
        const manualPlaylist = [
            ['DDBY - 流星阶段.mp3', '03:33', '流星阶段', 'DDBY'],
            // 在这里添加更多歌曲，例如：
            // ['song2.mp3', '04:15', '第二首歌', '歌手B'],
            // ['song3.mp3', '02:58', '第三首歌', '歌手C'],
        ];

        const LOOP_PLAYLIST = true;
        const SYNC_INTERVAL = 15000;
        const MAX_DRIFT_SECONDS = 2.0;
        const PRELOAD_BEFORE_END = 12;

        // ==================== DOM引用 ====================
        const audioPlayer = document.getElementById('audioPlayer');
        const btnPower = document.getElementById('btnPower');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const liveDot = document.getElementById('liveDot');
        const clockTime = document.getElementById('clockTime');
        const statusBadge = document.getElementById('statusBadge');
        const songIndex = document.getElementById('songIndex');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const progressBar = document.getElementById('progressBar');
        const progressCurrent = document.getElementById('progressCurrent');
        const progressTotal = document.getElementById('progressTotal');
        const upNextInfo = document.getElementById('upNextInfo');
        const upNextTime = document.getElementById('upNextTime');
        const scheduleToggle = document.getElementById('scheduleToggle');
        const scheduleArrow = document.getElementById('scheduleArrow');
        const scheduleWrapper = document.getElementById('scheduleWrapper');
        const scheduleTbody = document.getElementById('scheduleTbody');
        const nowPlayingSection = document.getElementById('nowPlayingSection');
        const toastContainer = document.getElementById('toastContainer');

        // ==================== 状态变量 ====================
        let playlist = [];
        let totalPlaylistDuration = 0;
        let isPoweredOn = false;
        let currentTrackIndex = -1;
        let currentTrackStartTime = null;
        let currentTrackEndTime = null;
        let switchTimeoutId = null;
        let syncIntervalId = null;
        let progressAnimFrameId = null;
        let preloadAudio = null;
        let toastTimeoutId = null;

        // ==================== 工具函数 ====================
        function parseDuration(durStr) {
            if (!durStr || typeof durStr !== 'string') return 0;
            durStr = durStr.trim();
            if (/^\d+(\.\d+)?$/.test(durStr)) return parseFloat(durStr);
            const parts = durStr.split(':').map(s => parseFloat(s.trim()));
            if (parts.length === 2) return parts[0] * 60 + parts[1];
            if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            return 0;
        }

        function formatSeconds(totalSec) {
            if (isNaN(totalSec) || totalSec < 0) return '00:00';
            const sec = Math.floor(totalSec);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            const pad = (n) => String(n).padStart(2, '0');
            if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
            return `${pad(m)}:${pad(s)}`;
        }

        function formatTime(date) {
            if (!date || isNaN(date.getTime())) return '--:--:--';
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function formatDateTime(date) {
            if (!date || isNaN(date.getTime())) return '--';
            const y = date.getFullYear();
            const mo = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${mo}-${d} ${formatTime(date)}`;
        }

        function showToast(message, isError = false) {
            if (toastTimeoutId) clearTimeout(toastTimeoutId);
            const existing = toastContainer.querySelector('.message-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'message-toast' + (isError ? ' error' : '');
            toast.textContent = message;
            toastContainer.appendChild(toast);

            toastTimeoutId = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        // ==================== 播放列表初始化 ====================
        function buildPlaylistFromManual() {
            playlist = manualPlaylist.map(row => {
                const filename = row[0] || '';
                const durationSec = parseDuration(row[1]);
                const title = row[2] || filename.replace(/\.[^.]+$/, '');
                const artist = row[3] || '未知艺术家';
                return { filename, durationSec, title, artist, startTime: null, endTime: null };
            }).filter(t => t.filename && t.durationSec > 0);

            if (playlist.length === 0) {
                showToast('❌ 播放列表为空，请检查手动配置的歌曲列表', true);
                scheduleTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#e74c3c;">列表为空</td></tr>';
                return false;
            }
            return true;
        }

        function buildSchedule() {
            totalPlaylistDuration = 0;
            let currentStart = RADIO_START.getTime();
            for (let i = 0; i < playlist.length; i++) {
                playlist[i].startTime = currentStart;
                playlist[i].endTime = currentStart + playlist[i].durationSec * 1000;
                currentStart = playlist[i].endTime;
                totalPlaylistDuration += playlist[i].durationSec;
            }
        }

        // ==================== 核心定位逻辑 ====================
        function findTrackAtTime(timestampMs) {
            const radioStartMs = RADIO_START.getTime();
            if (timestampMs < radioStartMs) {
                return {
                    trackIndex: 0, offsetSec: 0,
                    trackStartMs: playlist[0]?.startTime || radioStartMs,
                    trackEndMs: playlist[0]?.endTime || radioStartMs,
                    cycleNumber: 0, beforeStart: true
                };
            }

            let elapsedMs = timestampMs - radioStartMs;
            if (!LOOP_PLAYLIST && elapsedMs >= totalPlaylistDuration * 1000) {
                return { trackIndex: -1, offsetSec: 0, trackStartMs: 0, trackEndMs: 0, cycleNumber: 0, pastEnd: true };
            }

            const totalMs = totalPlaylistDuration * 1000;
            let cycleNumber = 0;
            if (LOOP_PLAYLIST && totalMs > 0) {
                cycleNumber = Math.floor(elapsedMs / totalMs);
                elapsedMs = elapsedMs % totalMs;
            }

            for (let i = 0; i < playlist.length; i++) {
                const relStart = playlist[i].startTime - radioStartMs;
                const relEnd = playlist[i].endTime - radioStartMs;
                if (elapsedMs >= relStart && elapsedMs < relEnd) {
                    const offsetSec = (elapsedMs - relStart) / 1000;
                    return {
                        trackIndex: i,
                        offsetSec: Math.max(0, Math.min(offsetSec, playlist[i].durationSec)),
                        trackStartMs: playlist[i].startTime,
                        trackEndMs: playlist[i].endTime,
                        cycleNumber
                    };
                }
            }
            return { trackIndex: 0, offsetSec: 0, trackStartMs: playlist[0]?.startTime || radioStartMs, trackEndMs: playlist[0]?.endTime || radioStartMs, cycleNumber: 0 };
        }

        function getCurrentPlaybackPosition() {
            return findTrackAtTime(Date.now());
        }

        // ==================== 播放控制 ====================
        function playTrackAt(trackIndex, offsetSec) {
            if (trackIndex < 0 || trackIndex >= playlist.length) return false;
            const track = playlist[trackIndex];
            const audioSrc = MUSIC_PATH_PREFIX + track.filename;

            if (audioPlayer.src !== audioSrc || audioPlayer.readyState === 0) {
                audioPlayer.src = audioSrc;
            }
            audioPlayer.currentTime = Math.max(0, Math.min(offsetSec, track.durationSec));
            audioPlayer.volume = parseFloat(volumeSlider.value) / 100;

            currentTrackIndex = trackIndex;
            currentTrackStartTime = track.startTime;
            currentTrackEndTime = track.endTime;

            updateNowPlayingDisplay();
            updateUpNextDisplay();
            updateScheduleTableHighlight();

            const playPromise = audioPlayer.play();
            if (playPromise) playPromise.catch(() => {});

            scheduleNextTrackSwitch();
            return true;
        }

        function scheduleNextTrackSwitch() {
            if (switchTimeoutId) clearTimeout(switchTimeoutId);
            if (currentTrackIndex < 0 || !currentTrackEndTime) return;
            const remainingMs = currentTrackEndTime - Date.now();
            if (remainingMs <= 0) {
                switchToNextTrack();
                return;
            }
            switchTimeoutId = setTimeout(() => switchToNextTrack(), remainingMs + 50);
            schedulePreload(remainingMs);
        }

        function schedulePreload(remainingMs) {
            const preloadDelay = remainingMs - PRELOAD_BEFORE_END * 1000;
            if (preloadDelay > 0) {
                setTimeout(() => {
                    const nextIndex = getNextTrackIndex();
                    if (nextIndex >= 0 && nextIndex < playlist.length) {
                        const nextSrc = MUSIC_PATH_PREFIX + playlist[nextIndex].filename;
                        if (!preloadAudio) {
                            preloadAudio = new Audio();
                            preloadAudio.preload = 'auto';
                            preloadAudio.volume = 0;
                        }
                        if (preloadAudio.src !== nextSrc) preloadAudio.src = nextSrc;
                    }
                }, preloadDelay);
            }
        }

        function getNextTrackIndex() {
            if (playlist.length === 0) return -1;
            let next = currentTrackIndex + 1;
            if (next >= playlist.length) return LOOP_PLAYLIST ? 0 : -1;
            return next;
        }

        function switchToNextTrack() {
            if (!isPoweredOn) return;
            const nextIndex = getNextTrackIndex();
            if (nextIndex < 0) {
                stopPlayback();
                statusBadge.textContent = '⏹ 播放结束';
                statusBadge.className = 'status-badge offline';
                songTitle.textContent = '今日节目已结束';
                songTitle.className = 'no-song';
                songArtist.textContent = '';
                songIndex.textContent = '—';
                progressBar.style.width = '0%';
                progressCurrent.textContent = '00:00';
                progressTotal.textContent = '00:00';
                upNextInfo.textContent = '—';
                upNextTime.textContent = '';
                return;
            }
            const now = Date.now();
            const nextTrack = playlist[nextIndex];
            let offsetSec = 0;
            if (now > nextTrack.startTime) {
                offsetSec = (now - nextTrack.startTime) / 1000;
                if (offsetSec > nextTrack.durationSec) offsetSec = 0;
            }
            playTrackAt(nextIndex, Math.max(0, offsetSec));
        }

        function stopPlayback() {
            audioPlayer.pause();
            audioPlayer.src = '';
            if (switchTimeoutId) clearTimeout(switchTimeoutId);
            if (syncIntervalId) clearInterval(syncIntervalId);
            if (progressAnimFrameId) cancelAnimationFrame(progressAnimFrameId);
            switchTimeoutId = syncIntervalId = progressAnimFrameId = null;
            currentTrackIndex = -1;
            currentTrackStartTime = currentTrackEndTime = null;
            progressBar.style.width = '0%';
            progressCurrent.textContent = '00:00';
            progressTotal.textContent = '00:00';
            updateScheduleTableHighlight();
        }

        function powerOn() {
            if (playlist.length === 0) {
                showToast('⚠️ 播放列表为空，请检查代码配置', true);
                return;
            }
            isPoweredOn = true;
            btnPower.classList.add('on');
            btnPower.textContent = '📻';
            statusBadge.textContent = '🟢 直播中';
            statusBadge.className = 'status-badge';
            liveDot.style.animation = 'livePulse 2s ease-in-out infinite';
            liveDot.style.background = 'var(--success)';

            const pos = getCurrentPlaybackPosition();
            if (pos.pastEnd) {
                statusBadge.textContent = '⏹ 播放结束';
                statusBadge.className = 'status-badge offline';
                songTitle.textContent = '今日节目已结束';
                songTitle.className = 'no-song';
                return;
            }
            if (pos.beforeStart && !LOOP_PLAYLIST) {
                statusBadge.textContent = '⏳ 等待开播';
                statusBadge.className = 'status-badge waiting';
                songTitle.textContent = '电台尚未开播';
                songTitle.className = 'no-song';
                songArtist.textContent = `预计开播时间：${formatDateTime(RADIO_START)}`;
                const waitMs = RADIO_START.getTime() - Date.now();
                if (waitMs > 0 && waitMs < 86400000) {
                    switchTimeoutId = setTimeout(() => {
                        if (isPoweredOn) {
                            playTrackAt(0, 0);
                            statusBadge.textContent = '🟢 直播中';
                            statusBadge.className = 'status-badge';
                        }
                    }, waitMs + 100);
                }
                return;
            }

            playTrackAt(pos.trackIndex, pos.offsetSec);
            startSyncTimer();
            startProgressUpdater();
        }

        function powerOff() {
            isPoweredOn = false;
            btnPower.classList.remove('on');
            btnPower.textContent = '📻';
            statusBadge.textContent = '🔴 已关机';
            statusBadge.className = 'status-badge offline';
            liveDot.style.animation = 'none';
            liveDot.style.background = '#888';
            stopPlayback();
            songTitle.textContent = '按下电源键开启收音机';
            songTitle.className = 'no-song';
            songArtist.textContent = '';
            songIndex.textContent = '—';
            upNextInfo.textContent = '—';
            upNextTime.textContent = '';
            updateScheduleTableHighlight();
        }

        function startSyncTimer() {
            if (syncIntervalId) clearInterval(syncIntervalId);
            syncIntervalId = setInterval(() => {
                if (!isPoweredOn || currentTrackIndex < 0) return;
                syncPlaybackPosition();
            }, SYNC_INTERVAL);
        }

        function syncPlaybackPosition() {
            if (!isPoweredOn || currentTrackIndex < 0 || playlist.length === 0) return;
            const now = Date.now();
            const pos = findTrackAtTime(now);
            if (pos.pastEnd && !LOOP_PLAYLIST) {
                stopPlayback();
                statusBadge.textContent = '⏹ 播放结束';
                statusBadge.className = 'status-badge offline';
                return;
            }
            if (pos.trackIndex !== currentTrackIndex) {
                playTrackAt(pos.trackIndex, pos.offsetSec);
                return;
            }
            const drift = Math.abs(pos.offsetSec - audioPlayer.currentTime);
            if (drift > MAX_DRIFT_SECONDS) {
                audioPlayer.currentTime = pos.offsetSec;
            }
        }

        function startProgressUpdater() {
            if (progressAnimFrameId) cancelAnimationFrame(progressAnimFrameId);
            function update() {
                if (!isPoweredOn || currentTrackIndex < 0) {
                    progressAnimFrameId = requestAnimationFrame(update);
                    return;
                }
                const track = playlist[currentTrackIndex];
                if (!track) {
                    progressAnimFrameId = requestAnimationFrame(update);
                    return;
                }
                const elapsedInTrack = (Date.now() - currentTrackStartTime) / 1000;
                const clamped = Math.max(0, Math.min(elapsedInTrack, track.durationSec));
                progressBar.style.width = (track.durationSec > 0 ? (clamped / track.durationSec) * 100 : 0) + '%';
                progressCurrent.textContent = formatSeconds(clamped);
                progressTotal.textContent = formatSeconds(track.durationSec);
                progressAnimFrameId = requestAnimationFrame(update);
            }
            progressAnimFrameId = requestAnimationFrame(update);
        }

        // ==================== UI更新 ====================
        function updateNowPlayingDisplay() {
            if (currentTrackIndex < 0 || currentTrackIndex >= playlist.length) return;
            const track = playlist[currentTrackIndex];
            songTitle.textContent = track.title;
            songTitle.className = 'song-title';
            songArtist.textContent = track.artist;
            songIndex.textContent = `TRACK ${currentTrackIndex + 1} / ${playlist.length}`;
        }

        function updateUpNextDisplay() {
            const nextIndex = getNextTrackIndex();
            if (nextIndex < 0 || nextIndex >= playlist.length) {
                upNextInfo.textContent = '—';
                upNextTime.textContent = '';
                return;
            }
            const nextTrack = playlist[nextIndex];
            upNextInfo.textContent = `${nextTrack.title} — ${nextTrack.artist}`;
            let nextStartMs = nextTrack.startTime;
            if (LOOP_PLAYLIST && nextStartMs < Date.now()) {
                const totalMs = totalPlaylistDuration * 1000;
                const cyclesPassed = Math.floor((Date.now() - nextStartMs) / totalMs) + 1;
                nextStartMs += cyclesPassed * totalMs;
            }
            upNextTime.textContent = formatTime(new Date(nextStartMs));
        }

        function updateScheduleTableHighlight() {
            const rows = scheduleTbody.querySelectorAll('tr');
            rows.forEach((row, i) => {
                row.classList.toggle('now-playing-row', i === currentTrackIndex && isPoweredOn);
            });
        }

        function renderScheduleTable() {
            if (playlist.length === 0) {
                scheduleTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-secondary);">暂无数据</td></tr>';
                return;
            }
            let html = '';
            playlist.forEach((track, i) => {
                const startTimeStr = formatTime(new Date(track.startTime));
                const durStr = formatSeconds(track.durationSec);
                html += `<tr data-index="${i}">
                    <td class="time-col">${startTimeStr}</td>
                    <td class="dur-col">${durStr}</td>
                    <td class="title-col" title="${escapeHtml(track.title)}">${escapeHtml(track.title)}</td>
                    <td class="artist-col" title="${escapeHtml(track.artist)}">${escapeHtml(track.artist)}</td>
                </tr>`;
            });
            scheduleTbody.innerHTML = html;
            updateScheduleTableHighlight();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function updateClock() {
            const now = new Date();
            clockTime.textContent = formatTime(now) + ' · ' + now.toLocaleDateString('zh-CN', { month:'short', day:'numeric' });
        }

        // ==================== 事件绑定 ====================
        btnPower.addEventListener('click', () => isPoweredOn ? powerOff() : powerOn());
        volumeSlider.addEventListener('input', () => {
            const vol = parseInt(volumeSlider.value);
            volumeValue.textContent = vol + '%';
            audioPlayer.volume = vol / 100;
        });

        audioPlayer.addEventListener('error', () => {
            const track = playlist[currentTrackIndex];
            showToast(`⚠️ 无法播放：${track?.title || '未知歌曲'}，请检查文件路径`, true);
            if (isPoweredOn && currentTrackIndex >= 0) {
                setTimeout(() => { if (isPoweredOn) switchToNextTrack(); }, 2000);
            }
        });

        audioPlayer.addEventListener('canplay', () => {
            if (isPoweredOn && audioPlayer.paused && audioPlayer.src) {
                audioPlayer.play().catch(() => {});
            }
        });

        scheduleToggle.addEventListener('click', () => {
            const isOpen = scheduleWrapper.classList.toggle('open');
            scheduleArrow.classList.toggle('open', isOpen);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') { e.preventDefault(); btnPower.click(); }
            if (e.key === 'ArrowUp') { e.preventDefault(); volumeSlider.value = Math.min(100, +volumeSlider.value + 5); volumeSlider.dispatchEvent(new Event('input')); }
            if (e.key === 'ArrowDown') { e.preventDefault(); volumeSlider.value = Math.max(0, +volumeSlider.value - 5); volumeSlider.dispatchEvent(new Event('input')); }
            if (e.key.toLowerCase() === 'm') {
                if (audioPlayer.volume > 0.01) { audioPlayer.volume = 0; volumeSlider.value = 0; volumeValue.textContent = '0%'; }
                else { const vol = 75; audioPlayer.volume = vol/100; volumeSlider.value = vol; volumeValue.textContent = vol+'%'; }
            }
        });

        window.addEventListener('beforeunload', () => {
            stopPlayback();
            if (preloadAudio) { preloadAudio.src = ''; preloadAudio = null; }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isPoweredOn) {
                setTimeout(() => { if (isPoweredOn) syncPlaybackPosition(); }, 300);
            }
        });

        // ==================== 启动 ====================
        function init() {
            audioPlayer.volume = parseFloat(volumeSlider.value) / 100;
            volumeValue.textContent = volumeSlider.value + '%';
            updateClock();
            setInterval(updateClock, 1000);

            // 从手动数组构建播放列表
            if (buildPlaylistFromManual()) {
                buildSchedule();
                renderScheduleTable();
                updateUpNextDisplay();
                showToast(`✅ 已加载 ${playlist.length} 首歌曲，电台就绪`);
            }
        }
        init();
    })();
    
</script>
